<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>إنشاء حساب | NEXORA</title>

<link
    rel="stylesheet"
    href="style.css?v=5"
>

</head><body><main class="auth-page"><div class="auth-container">


    <!-- LOGO -->

    <div class="auth-logo">
        NEXORA
    </div>


    <!-- SUBTITLE -->

    <div class="auth-subtitle">
        انضم إلى منصتك الرقمية الذكية
    </div>


    <!-- REGISTER CARD -->

    <div class="auth-card">


        <h1>
            إنشاء حساب جديد
        </h1>


        <!-- ERROR -->

        <div
            id="registerError"
            class="error-message hidden"
        ></div>


        <!-- SUCCESS -->

        <div
            id="registerSuccess"
            class="success-message hidden"
        ></div>


        <!-- REGISTER FORM -->

        <form id="registerForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="registerName">
                    الاسم
                </label>

                <input
                    id="registerName"
                    class="form-input"
                    type="text"
                    placeholder="أدخل اسمك"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL OR PHONE -->

            <div class="form-group">

                <label for="registerIdentifier">
                    البريد الإلكتروني أو رقم الهاتف
                </label>

                <input
                    id="registerIdentifier"
                    class="form-input"
                    type="text"
                    placeholder="أدخل البريد أو رقم الهاتف"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="registerPassword">
                    كلمة المرور
                </label>

                <input
                    id="registerPassword"
                    class="form-input"
                    type="password"
                    placeholder="6 أحرف على الأقل"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="registerConfirmPassword">
                    تأكيد كلمة المرور
                </label>

                <input
                    id="registerConfirmPassword"
                    class="form-input"
                    type="password"
                    placeholder="أعد كتابة كلمة المرور"
                    autocomplete="new-password"
                    required
                >

            </div>


            <!-- REFERRAL -->

            <div class="form-group">

                <label for="registerReferral">

                    كود الدعوة

                    <span class="optional-text">
                        (اختياري)
                    </span>

                </label>

                <input
                    id="registerReferral"
                    class="form-input"
                    type="text"
                    placeholder="أدخل كود الدعوة إن وجد"
                >

            </div>


            <!-- TERMS -->

            <div class="terms-row">

                <input
                    id="registerTerms"
                    type="checkbox"
                    required
                >

                <label for="registerTerms">

                    أوافق على
                    
                    <a
                        href="privacy.html"
                        class="privacy-link"
                    >
                        شروط الاستخدام وسياسة الخصوصية
                    </a>

                </label>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="auth-btn"
                id="registerButton"
            >

                إنشاء الحساب

            </button>


        </form>


        <!-- LOGIN LINK -->

        <div class="auth-switch">

            لديك حساب بالفعل؟

            <a href="login.html">
                تسجيل الدخول
            </a>

        </div>


        <!-- HOME -->

        <div class="auth-switch home-link">

            <a href="index.html">
                العودة إلى الرئيسية
            </a>

        </div>


    </div>


    <!-- FOOTER -->

    <div class="auth-footer">

        ©
        <span data-current-year></span>
        NEXORA

    </div>


</div>

</main><script>

"use strict";


/* =====================================================
   NEXORA - REGISTER SYSTEM
   ===================================================== */


/* =====================================================
   KEYS
   ===================================================== */

const USERS_KEY =
    "nexora_users";


/* =====================================================
   ELEMENTS
   ===================================================== */

const registerForm =
    document.getElementById(
        "registerForm"
    );


const registerError =
    document.getElementById(
        "registerError"
    );


const registerSuccess =
    document.getElementById(
        "registerSuccess"
    );


/* =====================================================
   GET USERS
   ===================================================== */

function getUsers() {

    try {

        const savedUsers =
            localStorage.getItem(
                USERS_KEY
            );


        if (!savedUsers) {

            return [];

        }


        const users =
            JSON.parse(
                savedUsers
            );


        return Array.isArray(users)
            ? users
            : [];

    }

    catch (error) {

        console.error(
            "Users data error:",
            error
        );


        return [];

    }

}


/* =====================================================
   SAVE USERS
   ===================================================== */

function saveUsers(users) {

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

}


/* =====================================================
   SHOW ERROR
   ===================================================== */

function showError(message) {

    registerSuccess.classList.add(
        "hidden"
    );


    registerError.textContent =
        message;


    registerError.classList.remove(
        "hidden"
    );

}


/* =====================================================
   SHOW SUCCESS
   ===================================================== */

function showSuccess(message) {

    registerError.classList.add(
        "hidden"
    );


    registerSuccess.textContent =
        message;


    registerSuccess.classList.remove(
        "hidden"
    );

}


/* =====================================================
   GENERATE USER ID
   ===================================================== */

function generateUserId() {

    return (

        "NEXORA-" +

        Date.now() +

        "-" +

        Math.floor(
            Math.random() * 10000
        )

    );

}


/* =====================================================
   GENERATE REFERRAL CODE
   ===================================================== */

function generateReferralCode() {

    const randomNumber =
        Math.floor(
            100000 +
            Math.random() * 900000
        );


    return (

        "NEXORA" +

        randomNumber

    );

}


/* =====================================================
   REGISTER
   ===================================================== */

registerForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* HIDE OLD MESSAGES */

        registerError.classList.add(
            "hidden"
        );


        registerSuccess.classList.add(
            "hidden"
        );


        /* GET FORM DATA */

        const name =
            document
                .getElementById(
                    "registerName"
                )
                .value
                .trim();


        const identifier =
            document
                .getElementById(
                    "registerIdentifier"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "registerPassword"
                )
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "registerConfirmPassword"
                )
                .value;


        const referral =
            document
                .getElementById(
                    "registerReferral"
                )
                .value
                .trim();


        /* VALIDATION */

        if (

            !name ||

            !identifier ||

            !password ||

            !confirmPassword

        ) {

            showError(
                "يرجى إدخال جميع البيانات المطلوبة."
            );

            return;

        }


        /* PASSWORD LENGTH */

        if (
            password.length < 6
        ) {

            showError(
                "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل."
            );

            return;

        }


        /* PASSWORD MATCH */

        if (
            password !==
            confirmPassword
        ) {

            showError(
                "كلمتا المرور غير متطابقتين."
            );

            return;

        }


        /* GET USERS */

        const users =
            getUsers();


        /* CHECK DUPLICATE */

        const exists =
            users.some(
                function(user) {

                    if (
                        !user.identifier
                    ) {

                        return false;

                    }


                    return (

                        String(
                            user.identifier
                        )
                        .toLowerCase()
                        .trim()

                        ===

                        identifier
                            .toLowerCase()
                            .trim()

                    );

                }
            );


        if (exists) {

            showError(
                "هذا البريد الإلكتروني أو رقم الهاتف مسجل مسبقًا."
            );

            return;

        }


        /* CREATE USER */

        const newUser = {

            id:
                generateUserId(),


            name:
                name,


            identifier:
                identifier,


            password:
                password,


            referral:
                referral,


            referralCode:
                generateReferralCode(),


            balance:
                0,


            team:
                0,


            tasks:
                0,


            createdAt:
                new Date().toISOString()

        };


        /* ADD USER */

        users.push(
            newUser
        );


        /* SAVE USERS */

        saveUsers(
            users
        );


        /* SUCCESS */

        showSuccess(
            "تم إنشاء الحساب بنجاح. يمكنك الآن تسجيل الدخول."
        );


        /* RESET FORM */

        registerForm.reset();


        /* REDIRECT */

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1200
        );

    }
);


/* =====================================================
   CURRENT YEAR
   ===================================================== */

const yearElement =
    document.querySelector(
        "[data-current-year]"
    );


if (yearElement) {

    yearElement.textContent =
        new Date().getFullYear();

}

</script></body></html>
