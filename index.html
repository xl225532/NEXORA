<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NEXORA | تسجيل الدخول</title>

<link
    rel="stylesheet"
    href="style.css?v=5"
>

</head><body><main class="welcome-page">

    <div class="welcome-container">

        <!-- LOGO -->

        <div class="welcome-logo">
            NEXORA
        </div>


        <!-- TITLE -->

        <h1 class="welcome-title">
            مرحبًا بك في NEXORA
        </h1>


        <p class="welcome-text">
            سجّل الدخول إلى حسابك أو أنشئ حسابًا جديدًا للبدء.
        </p>


        <!-- BUTTONS -->

        <div class="welcome-buttons">

            <a
                href="login.html"
                class="welcome-btn primary"
            >
                تسجيل الدخول
            </a>


            <a
                href="register.html"
                class="welcome-btn secondary"
            >
                إنشاء حساب
            </a>

        </div>


        <!-- PRIVACY -->

        <div class="privacy-box">

            <label class="privacy-check">

                <input
                    type="checkbox"
                    id="privacyAgreement"
                >

                <span>
                    أوافق على
                    <a
                        href="privacy.html"
                        target="_blank"
                    >
                        سياسة الخصوصية
                    </a>
                    وشروط استخدام المنصة.
                </span>

            </label>


            <div
                id="privacyError"
                class="privacy-error hidden"
            >
                يجب الموافقة على سياسة الخصوصية للمتابعة.
            </div>

        </div>


        <!-- FOOTER -->

        <div class="welcome-footer">

            ©
            <span id="currentYear"></span>
            NEXORA
            - جميع الحقوق محفوظة.

        </div>

    </div>

</main>


<script>

    "use strict";


    /*
    =========================================
    CURRENT YEAR
    =========================================
    */

    const yearElement =
        document.getElementById(
            "currentYear"
        );


    if (yearElement) {

        yearElement.textContent =
            new Date().getFullYear();

    }


    /*
    =========================================
    PRIVACY AGREEMENT
    =========================================
    */

    const privacyAgreement =
        document.getElementById(
            "privacyAgreement"
        );


    const privacyError =
        document.getElementById(
            "privacyError"
        );


    /*
    =========================================
    CHECK LOGIN / REGISTER BUTTONS
    =========================================
    */

    document
        .querySelectorAll(
            ".welcome-btn"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function(event) {

                        if (
                            !privacyAgreement.checked
                        ) {

                            event.preventDefault();


                            privacyError.classList.remove(
                                "hidden"
                            );


                            privacyAgreement.focus();


                            return;

                        }


                        privacyError.classList.add(
                            "hidden"
                        );

                    }
                );

            }
        );


    /*
    =========================================
    HIDE ERROR WHEN USER AGREES
    =========================================
    */

    privacyAgreement.addEventListener(
        "change",
        function() {

            if (
                this.checked
            ) {

                privacyError.classList.add(
                    "hidden"
                );

            }

        }
    );

</script>

</body></html>
