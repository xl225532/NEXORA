<!DOCTYPE html><html lang="ar" dir="rtl"><head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>تسجيل الدخول | NEXORA</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head><body><main class="auth-page"><div class="auth-container"><!-- LOGO -->

<div class="auth-logo">
    NEXORA
</div>


<div class="auth-subtitle">
    مرحبًا بك من جديد
</div>


<!-- LOGIN CARD -->

<div class="auth-card">

    <h1>
        تسجيل الدخول
    </h1>


    <!-- ERROR -->

    <div
        id="loginError"
        class="error-message hidden"
    ></div>


    <!-- SUCCESS -->

    <div
        id="loginSuccess"
        class="success-message hidden"
    ></div>


    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- IDENTIFIER -->

        <div class="form-group">

            <label for="loginIdentifier">
                البريد الإلكتروني أو رقم الهاتف
            </label>

            <input
                id="loginIdentifier"
                class="form-input"
                type="text"
                placeholder="أدخل البريد أو رقم الهاتف"
                autocomplete="username"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="loginPassword">
                كلمة المرور
            </label>

            <input
                id="loginPassword"
                class="form-input"
                type="password"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- REMEMBER ME -->

        <div
            style="
                display:flex;
                align-items:center;
                gap:8px;
                margin-bottom:18px;
                color:#888;
                font-size:13px;
            "
        >

            <input
                id="rememberMe"
                type="checkbox"
                style="
                    width:18px;
                    height:18px;
                    accent-color:#d4af37;
                "
            >

            <label
                for="rememberMe"
                style="margin:0;"
            >

                تذكرني

            </label>

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            class="auth-btn"
            id="loginButton"
        >

            تسجيل الدخول

        </button>


    </form>


    <!-- REGISTER -->

    <div class="auth-switch">

        ليس لديك حساب؟

        <a href="register.html">
            إنشاء حساب جديد
        </a>

    </div>


    <!-- HOME -->

    <div
        class="auth-switch"
        style="margin-top:12px;"
    >

        <a href="index.html">
            العودة إلى الرئيسية
        </a>

    </div>


</div>


<!-- FOOTER -->

<div
    style="
        text-align:center;
        color:#555;
        font-size:12px;
        margin-top:20px;
    "
>

    ©
    <span data-current-year></span>
    NEXORA

</div>

</div></main><script>

"use strict";


/*
=========================================================
NEXORA - LOGIN SYSTEM
نسخة تجريبية محلية
=========================================================
*/


const USERS_KEY =
    "nexora_users";


const SESSION_KEY =
    "nexora_session";


/*
=========================================================
ELEMENTS
=========================================================
*/

const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const loginSuccess =
    document.getElementById(
        "loginSuccess"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


/*
=========================================================
GET USERS
=========================================================
*/

function getUsers() {

    try {

        const savedUsers =
            localStorage.getItem(
                USERS_KEY
            );


        if (!savedUsers) {

            return [];

        }


        const users =
            JSON.parse(
                savedUsers
            );


        return Array.isArray(users)
            ? users
            : [];

    }

    catch(error) {

        console.error(
            "Users data error:",
            error
        );


        return [];

    }

}


/*
=========================================================
SHOW ERROR
=========================================================
*/

function showLoginError(message) {

    loginSuccess.classList.add(
        "hidden"
    );


    loginError.textContent =
        message;


    loginError.classList.remove(
        "hidden"
    );

}


/*
=========================================================
SHOW SUCCESS
=========================================================
*/

function showLoginSuccess(message) {

    loginError.classList.add(
        "hidden"
    );


    loginSuccess.textContent =
        message;


    loginSuccess.classList.remove(
        "hidden"
    );

}


/*
=========================================================
LOGIN
=========================================================
*/

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /*
        ---------------------------------------------
        HIDE OLD MESSAGES
        ---------------------------------------------
        */

        loginError.classList.add(
            "hidden"
        );


        loginSuccess.classList.add(
            "hidden"
        );


        /*
        ---------------------------------------------
        GET FORM DATA
        ---------------------------------------------
        */

        const identifier =
            document
                .getElementById(
                    "loginIdentifier"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        const rememberMe =
            document
                .getElementById(
                    "rememberMe"
                )
                .checked;


        /*
        ---------------------------------------------
        VALIDATION
        ---------------------------------------------
        */

        if (
            !identifier ||
            !password
        ) {

            showLoginError(
                "يرجى إدخال البريد الإلكتروني أو رقم الهاتف وكلمة المرور."
            );

            return;

        }


        /*
        ---------------------------------------------
        BUTTON LOADING
        ---------------------------------------------
        */

        loginButton.disabled =
            true;


        loginButton.textContent =
            "جاري تسجيل الدخول...";


        /*
        ---------------------------------------------
        GET USERS
        ---------------------------------------------
        */

        const users =
            getUsers();


        /*
        ---------------------------------------------
        FIND USER
        ---------------------------------------------
        */

        const user =
            users.find(
                function(item) {

                    return (
                        item.identifier
                            .toLowerCase()
                        ===
                        identifier
                            .toLowerCase()
                    );

                }
            );


        /*
        ---------------------------------------------
        USER NOT FOUND
        ---------------------------------------------
        */

        if (!user) {

            showLoginError(
                "البريد الإلكتروني أو رقم الهاتف غير مسجل."
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "تسجيل الدخول";


            return;

        }


        /*
        ---------------------------------------------
        PASSWORD CHECK
        ---------------------------------------------
        */

        if (
            user.password
            !==
            password
        ) {

            showLoginError(
                "كلمة المرور غير صحيحة."
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "تسجيل الدخول";


            return;

        }


        /*
        ---------------------------------------------
        CREATE SESSION
        ---------------------------------------------
        */

        const session = {

            userId:
                user.id,

            name:
                user.name,

            identifier:
                user.identifier,

            referralCode:
                user.referralCode,

            balance:
                user.balance || 0,

            team:
                user.team || 0,

            tasks:
                user.tasks || 0,

            loginAt:
                new Date().toISOString()

        };


        /*
        ---------------------------------------------
        SAVE SESSION
        ---------------------------------------------
        */

        if (
            rememberMe
        ) {

            localStorage.setItem(
                SESSION_KEY,
                JSON.stringify(
                    session
                )
            );


            sessionStorage.removeItem(
                SESSION_KEY
            );

        }

        else {

            sessionStorage.setItem(
                SESSION_KEY,
                JSON.stringify(
                    session
                )
            );


            localStorage.removeItem(
                SESSION_KEY
            );

        }


        /*
        ---------------------------------------------
        SUCCESS
        ---------------------------------------------
        */

        showLoginSuccess(
            "تم تسجيل الدخول بنجاح. جاري فتح لوحة التحكم..."
        );


        /*
        ---------------------------------------------
        REDIRECT
        ---------------------------------------------
        */

        setTimeout(
            function() {

                window.location.href =
                    "dashboard.html";

            },
            800
        );

    }
);


/*
=========================================================
CURRENT YEAR
=========================================================
*/

const yearElement =
    document.querySelector(
        "[data-current-year]"
    );


if (yearElement) {

    yearElement.textContent =
        new Date().getFullYear();

}

</script></body></html>
