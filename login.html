"use strict";


/* =====================================================
   NEXORA LOGIN SYSTEM
   نظام تسجيل الدخول المحلي
===================================================== */


/* =====================================================
   STORAGE KEYS
===================================================== */

const USERS_KEY =
    "nexora_users";


const SESSION_KEY =
    "nexora_session";



/* =====================================================
   ELEMENTS
===================================================== */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const loginSuccess =
    document.getElementById(
        "loginSuccess"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginIdentifier =
    document.getElementById(
        "loginIdentifier"
    );


const loginPassword =
    document.getElementById(
        "loginPassword"
    );


const rememberMe =
    document.getElementById(
        "rememberMe"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );



/* =====================================================
   GET USERS
===================================================== */

function getUsers(){

    try{

        const savedUsers =
            localStorage.getItem(
                USERS_KEY
            );


        if(!savedUsers){

            return [];

        }


        const users =
            JSON.parse(
                savedUsers
            );


        if(
            !Array.isArray(users)
        ){

            return [];

        }


        return users;

    }

    catch(error){

        console.error(
            "NEXORA users error:",
            error
        );


        return [];

    }

}



/* =====================================================
   SHOW ERROR
===================================================== */

function showLoginError(
    message
){

    loginSuccess.classList.add(
        "hidden"
    );


    loginError.textContent =
        message;


    loginError.classList.remove(
        "hidden"
    );

}



/* =====================================================
   SHOW SUCCESS
===================================================== */

function showLoginSuccess(
    message
){

    loginError.classList.add(
        "hidden"
    );


    loginSuccess.textContent =
        message;


    loginSuccess.classList.remove(
        "hidden"
    );

}



/* =====================================================
   HIDE MESSAGES
===================================================== */

function hideMessages(){

    loginError.classList.add(
        "hidden"
    );


    loginSuccess.classList.add(
        "hidden"
    );

}



/* =====================================================
   RESET LOGIN BUTTON
===================================================== */

function resetLoginButton(){

    loginButton.disabled =
        false;


    loginButton.textContent =
        "تسجيل الدخول";

}



/* =====================================================
   TOGGLE PASSWORD
===================================================== */

if(togglePassword){

    togglePassword.addEventListener(
        "click",
        function(){

            const isPassword =
                loginPassword.type
                ===
                "password";


            if(isPassword){

                loginPassword.type =
                    "text";


                togglePassword.textContent =
                    "إخفاء";

            }

            else{

                loginPassword.type =
                    "password";


                togglePassword.textContent =
                    "إظهار";

            }

        }
    );

}



/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        hideMessages();


        /*
        ---------------------------------------------
        GET DATA
        ---------------------------------------------
        */

        const identifier =
            loginIdentifier
                .value
                .trim();


        const password =
            loginPassword
                .value;


        /*
        ---------------------------------------------
        VALIDATION
        ---------------------------------------------
        */

        if(
            !identifier ||
            !password
        ){

            showLoginError(
                "يرجى إدخال البريد الإلكتروني أو رقم الهاتف وكلمة المرور."
            );


            return;

        }


        /*
        ---------------------------------------------
        LOADING
        ---------------------------------------------
        */

        loginButton.disabled =
            true;


        loginButton.textContent =
            "جاري التحقق...";


        /*
        ---------------------------------------------
        GET USERS
        ---------------------------------------------
        */

        const users =
            getUsers();


        /*
        ---------------------------------------------
        FIND USER
        ---------------------------------------------
        */

        const normalizedIdentifier =
            identifier.toLowerCase();


        const user =
            users.find(
                function(item){

                    if(
                        !item ||
                        !item.identifier
                    ){

                        return false;

                    }


                    return (
                        String(
                            item.identifier
                        )
                        .trim()
                        .toLowerCase()
                        ===
                        normalizedIdentifier
                    );

                }
            );



        /*
        ---------------------------------------------
        USER NOT FOUND
        ---------------------------------------------
        */

        if(!user){

            showLoginError(
                "البريد الإلكتروني أو رقم الهاتف غير مسجل."
            );


            resetLoginButton();


            return;

        }



        /*
        ---------------------------------------------
        PASSWORD CHECK
        ---------------------------------------------
        */

        if(
            String(
                user.password
            )
            !==
            String(
                password
            )
        ){

            showLoginError(
                "كلمة المرور غير صحيحة."
            );


            resetLoginButton();


            loginPassword.focus();


            return;

        }



        /*
        ---------------------------------------------
        CREATE SESSION
        ---------------------------------------------
        */

        const session = {

            userId:
                user.id ||
                Date.now(),


            name:
                user.name ||
                "المستخدم",


            identifier:
                user.identifier ||
                identifier,


            referralCode:
                user.referralCode ||
                "-",


            balance:
                Number(
                    user.balance ||
                    0
                ),


            team:
                Number(
                    user.team ||
                    0
                ),


            tasks:
                Number(
                    user.tasks ||
                    0
                ),


            loginAt:
                new Date()
                    .toISOString()

        };



        /*
        ---------------------------------------------
        SAVE SESSION
        ---------------------------------------------
        */

        try{

            if(
                rememberMe.checked
            ){

                /*
                تذكرني:
                حفظ الجلسة في localStorage
                */

                localStorage.setItem(
                    SESSION_KEY,
                    JSON.stringify(
                        session
                    )
                );


                sessionStorage.removeItem(
                    SESSION_KEY
                );

            }

            else{

                /*
                جلسة مؤقتة:
                تنتهي مع إغلاق تبويب المتصفح
                */

                sessionStorage.setItem(
                    SESSION_KEY,
                    JSON.stringify(
                        session
                    )
                );


                localStorage.removeItem(
                    SESSION_KEY
                );

            }

        }

        catch(error){

            console.error(
                "Session storage error:",
                error
            );


            showLoginError(
                "حدث خطأ أثناء إنشاء جلسة الدخول. حاول مرة أخرى."
            );


            resetLoginButton();


            return;

        }



        /*
        ---------------------------------------------
        SUCCESS
        ---------------------------------------------
        */

        showLoginSuccess(
            "تم تسجيل الدخول بنجاح. جاري فتح لوحة التحكم..."
        );


        loginButton.textContent =
            "تم الدخول ✓";



        /*
        ---------------------------------------------
        REDIRECT
        ---------------------------------------------
        */

        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            700
        );

    }
);



/* =====================================================
   CURRENT YEAR
===================================================== */

const yearElement =
    document.querySelector(
        "[data-current-year]"
    );


if(yearElement){

    yearElement.textContent =
        new Date()
            .getFullYear();

}


</script></body></html>
