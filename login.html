<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>تسجيل الدخول | NEXORA</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head><body><main class="auth-page"><div class="auth-container">


    <!-- LOGO -->

    <div class="auth-logo">
        NEXORA
    </div>


    <div class="auth-subtitle">
        مرحبًا بك من جديد
    </div>


    <!-- LOGIN CARD -->

    <div class="auth-card">


        <h1>
            تسجيل الدخول
        </h1>


        <!-- ERROR -->

        <div
            id="loginError"
            class="error-message hidden"
        >
        </div>


        <!-- SUCCESS -->

        <div
            id="loginSuccess"
            class="success-message hidden"
        >
        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- IDENTIFIER -->

            <div class="form-group">

                <label for="loginIdentifier">
                    البريد الإلكتروني أو رقم الهاتف
                </label>

                <input
                    id="loginIdentifier"
                    class="form-input"
                    type="text"
                    placeholder="أدخل البريد أو رقم الهاتف"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="loginPassword">
                    كلمة المرور
                </label>

                <input
                    id="loginPassword"
                    class="form-input"
                    type="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- REMEMBER -->

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:8px;
                    margin-bottom:18px;
                    color:#888;
                    font-size:13px;
                "
            >

                <input
                    id="rememberMe"
                    type="checkbox"
                    style="
                        width:18px;
                        height:18px;
                        accent-color:#d4af37;
                    "
                >

                <label
                    for="rememberMe"
                    style="margin:0;"
                >

                    تذكرني

                </label>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="auth-btn"
                id="loginButton"
            >

                تسجيل الدخول

            </button>


        </form>


        <!-- REGISTER -->

        <div class="auth-switch">

            ليس لديك حساب؟

            <a href="register.html">
                إنشاء حساب جديد
            </a>

        </div>


        <!-- HOME -->

        <div
            class="auth-switch"
            style="margin-top:12px;"
        >

            <a href="index.html">
                العودة إلى الرئيسية
            </a>

        </div>


    </div>


    <!-- FOOTER -->

    <div
        style="
            text-align:center;
            color:#555;
            font-size:12px;
            margin-top:20px;
        "
    >

        ©
        <span data-current-year></span>
        NEXORA

    </div>


</div>

</main><!-- MAIN JS --><script src="app.js"></script><!-- LOGIN SCRIPT --><script>

"use strict";


/*
=========================================================
NEXORA LOGIN
=========================================================
*/


const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const loginSuccess =
    document.getElementById(
        "loginSuccess"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


/*
=========================================================
HIDE MESSAGES
=========================================================
*/

function clearLoginMessages() {

    loginError.textContent =
        "";

    loginSuccess.textContent =
        "";

    loginError.classList.add(
        "hidden"
    );

    loginSuccess.classList.add(
        "hidden"
    );

}


/*
=========================================================
LOGIN FORM
=========================================================
*/

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        clearLoginMessages();


        /*
        ---------------------------------------------
        GET DATA
        ---------------------------------------------
        */

        const identifier =
            document
                .getElementById(
                    "loginIdentifier"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "loginPassword"
                )
                .value;


        const rememberMe =
            document
                .getElementById(
                    "rememberMe"
                )
                .checked;


        /*
        ---------------------------------------------
        VALIDATION
        ---------------------------------------------
        */

        if (
            !identifier
            ||
            !password
        ) {

            loginError.textContent =
                "يرجى إدخال البريد الإلكتروني أو رقم الهاتف وكلمة المرور.";

            loginError.classList.remove(
                "hidden"
            );

            return;

        }


        /*
        ---------------------------------------------
        BUTTON LOADING
        ---------------------------------------------
        */

        loginButton.disabled =
            true;


        loginButton.textContent =
            "جاري تسجيل الدخول...";


        /*
        ---------------------------------------------
        DEMO LOGIN
        ---------------------------------------------
        */

        setTimeout(
            function() {


                /*
                ---------------------------------------------
                CHECK PENDING USER
                ---------------------------------------------
                */

                const pendingUser =
                    localStorage.getItem(
                        "nexora_pending_user"
                    );


                /*
                ---------------------------------------------
                NO USER
                ---------------------------------------------
                */

                if (
                    !pendingUser
                ) {

                    loginError.textContent =
                        "لا يوجد حساب مسجل على هذا الجهاز. يرجى إنشاء حساب جديد أولًا.";

                    loginError.classList.remove(
                        "hidden"
                    );


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "تسجيل الدخول";


                    return;

                }


                /*
                ---------------------------------------------
                PARSE USER
                ---------------------------------------------
                */

                let user;


                try {

                    user =
                        JSON.parse(
                            pendingUser
                        );

                }

                catch(error) {

                    loginError.textContent =
                        "حدث خطأ في بيانات الحساب.";

                    loginError.classList.remove(
                        "hidden"
                    );


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "تسجيل الدخول";


                    return;

                }


                /*
                ---------------------------------------------
                CHECK IDENTIFIER
                ---------------------------------------------
                */

                if (
                    user.identifier.toLowerCase()
                    !==
                    identifier.toLowerCase()
                ) {

                    loginError.textContent =
                        "البريد الإلكتروني أو رقم الهاتف غير صحيح.";

                    loginError.classList.remove(
                        "hidden"
                    );


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "تسجيل الدخول";


                    return;

                }


                /*
                ---------------------------------------------
                DEMO PASSWORD CHECK
                ---------------------------------------------
                */

                /*
                   في النسخة التجريبية الحالية
                   كلمة المرور لا يتم حفظها في الحساب.

                   لذلك لا يمكن التحقق من كلمة المرور
                   بشكل حقيقي قبل إضافة قاعدة البيانات.

                   سنقوم بإصلاح ذلك عند بناء السيرفر.
                */


                /*
                ---------------------------------------------
                CREATE SESSION
                ---------------------------------------------
                */

                const session = {

                    userId:
                        user.id,

                    name:
                        user.name,

                    identifier:
                        user.identifier,

                    referralCode:
                        user.referralCode,

                    balance:
                        user.balance || 0,

                    team:
                        user.team || 0,

                    tasks:
                        user.tasks || 0,

                    loginAt:
                        new Date().toISOString()

                };


                /*
                ---------------------------------------------
                SAVE SESSION
                ---------------------------------------------
                */

                if (
                    rememberMe
                ) {

                    localStorage.setItem(
                        "nexora_session",
                        JSON.stringify(
                            session
                        )
                    );

                }

                else {

                    sessionStorage.setItem(
                        "nexora_session",
                        JSON.stringify(
                            session
                        )
                    );

                }


                /*
                ---------------------------------------------
                SUCCESS
                ---------------------------------------------
                */

                loginSuccess.textContent =
                    "تم تسجيل الدخول بنجاح. جاري فتح لوحة التحكم...";

                loginSuccess.classList.remove(
                    "hidden"
                );


                /*
                ---------------------------------------------
                REDIRECT
                ---------------------------------------------
                */

                setTimeout(
                    function() {

                        window.location.href =
                            "dashboard.html";

                    },
                    800
                );


            },
            700
        );

    }
);


/*
=========================================================
YEAR
=========================================================
*/

const yearElement =
    document.querySelector(
        "[data-current-year]"
    );


if (yearElement) {

    yearElement.textContent =
        new Date().getFullYear();

}


</script></body></html>
